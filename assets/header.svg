<svg width="900" height="260" viewBox="0 0 900 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Shergin N S - Software Developer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#140a26"/><stop offset="0.55" stop-color="#2a1550"/><stop offset="1" stop-color="#4b2a85"/>
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9c2ff"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#ffffff" fill-opacity="0.08"/></pattern>
    <radialGradient id="glow"><stop offset="0" stop-color="#b388eb" stop-opacity="0.55"/><stop offset="1" stop-color="#b388eb" stop-opacity="0"/></radialGradient>
  </defs>
  <style>
    .name{font:800 62px 'Segoe UI',Helvetica,Arial,sans-serif;letter-spacing:2px}
    .role{font:600 22px 'SFMono-Regular',Consolas,'Courier New',monospace;fill:#5eead4}
    .tag{font:400 15px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#d9c2ff}
    .r{opacity:0;animation:cycle 9s infinite}
    .r2{animation-delay:3s}.r3{animation-delay:6s}
    @keyframes cycle{0%{opacity:0;transform:translateY(8px)}4%{opacity:1;transform:translateY(0)}30%{opacity:1}34%{opacity:0}100%{opacity:0}}
    .pulse{animation:pulse 3s ease-in-out infinite}
    @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
    .cursor{animation:blink 1s steps(1) infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect width="900" height="260" rx="18" fill="url(#bg)"/>
  <rect width="900" height="260" rx="18" fill="url(#dots)"/>
  <circle cx="760" cy="90" r="140" fill="url(#glow)"/>

  <!-- neural-network motif -->
  <g stroke="#b388eb" stroke-opacity="0.45" stroke-width="1.2">
    <line x1="650" y1="60" x2="730" y2="40"/><line x1="650" y1="60" x2="730" y2="110"/><line x1="650" y1="60" x2="730" y2="180"/>
    <line x1="650" y1="130" x2="730" y2="40"/><line x1="650" y1="130" x2="730" y2="110"/><line x1="650" y1="130" x2="730" y2="180"/>
    <line x1="650" y1="200" x2="730" y2="110"/><line x1="650" y1="200" x2="730" y2="180"/>
    <line x1="730" y1="40" x2="810" y2="80"/><line x1="730" y1="110" x2="810" y2="80"/><line x1="730" y1="110" x2="810" y2="160"/><line x1="730" y1="180" x2="810" y2="160"/>
    <line x1="810" y1="80" x2="860" y2="120"/><line x1="810" y1="160" x2="860" y2="120"/>
  </g>
  <g fill="#e9dcff">
    <circle class="pulse" cx="650" cy="60" r="6"/><circle class="pulse" style="animation-delay:.4s" cx="650" cy="130" r="6"/><circle class="pulse" style="animation-delay:.8s" cx="650" cy="200" r="6"/>
    <circle class="pulse" style="animation-delay:1.2s" cx="730" cy="40" r="6"/><circle class="pulse" style="animation-delay:1.6s" cx="730" cy="110" r="6"/><circle class="pulse" style="animation-delay:2s" cx="730" cy="180" r="6"/>
    <circle class="pulse" style="animation-delay:.6s" cx="810" cy="80" r="6"/><circle class="pulse" style="animation-delay:1s" cx="810" cy="160" r="6"/>
    <circle fill="#5eead4" cx="860" cy="120" r="8"/>
  </g>

  <text class="name" x="50" y="112" fill="url(#name)">SHERGIN N S</text>
  <g>
    <text class="role r" x="52" y="158">&gt; Software Developer</text>
    <text class="role r r2" x="52" y="158">&gt; Generative AI + RAG Builder</text>
    <text class="role r r3" x="52" y="158">&gt; Python · NLP · LLM Apps</text>
  </g>
  <text class="cursor" x="52" y="158" fill="#5eead4" font-family="Consolas,monospace" font-size="22" opacity="0"> </text>
  <text class="tag" x="52" y="205">Turning documents into answers, summaries and quizzes.</text>
  <text class="tag" x="52" y="228" fill-opacity="0.75">Kanyakumari, Tamil Nadu · Open to opportunities</text>
</svg>
