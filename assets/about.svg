<svg width="900" height="300" viewBox="0 0 900 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="About Shergin in a terminal window" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .m{font:15px 'SFMono-Regular',Consolas,'Courier New',monospace}
    .p{fill:#b388eb}.c{fill:#e9e3f5}.k{fill:#5eead4}.d{fill:#8b7fa8}
    .l{opacity:0;animation:show .4s forwards}
    @keyframes show{to{opacity:1}}
    .live{animation:blink 1.2s ease-in-out infinite}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  </style>
  <rect width="900" height="300" rx="14" fill="#140a26"/>
  <rect width="900" height="40" rx="14" fill="#241345"/>
  <rect y="26" width="900" height="14" fill="#241345"/>
  <circle cx="26" cy="20" r="6" fill="#ff5f57"/><circle cx="48" cy="20" r="6" fill="#febc2e"/><circle cx="70" cy="20" r="6" fill="#28c840"/>
  <text class="m d" x="330" y="25">shergin@portfolio: ~</text>

  <g class="m">
    <text class="l" style="animation-delay:.3s" x="28" y="76"><tspan class="p">$</tspan> <tspan class="c">whoami</tspan></text>
    <text class="l k" style="animation-delay:.7s" x="48" y="98">Shergin N S - AI/ML-focused Software Developer</text>

    <text class="l" style="animation-delay:1.3s" x="28" y="130"><tspan class="p">$</tspan> <tspan class="c">cat focus.txt</tspan></text>
    <text class="l k" style="animation-delay:1.7s" x="48" y="152">Generative AI | NLP | RAG | LLM APIs | Vector Search</text>

    <text class="l" style="animation-delay:2.3s" x="28" y="184"><tspan class="p">$</tspan> <tspan class="c">cat education.txt</tspan></text>
    <text class="l k" style="animation-delay:2.7s" x="48" y="206">B.E. Computer Science &amp; Engineering, 2022-2026</text>
    <text class="l d" style="animation-delay:2.9s" x="48" y="226">Good Shepherd College of Engineering &amp; Technology</text>

    <text class="l" style="animation-delay:3.5s" x="28" y="258"><tspan class="p">$</tspan> <tspan class="c">status</tspan></text>
    <text class="l" style="animation-delay:3.9s" x="48" y="280"><tspan class="k live">●</tspan> <tspan class="c">open to opportunities</tspan></text>
  </g>
</svg>
