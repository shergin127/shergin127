<svg width="900" height="270" viewBox="0 0 900 270" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="RAG pipeline of the AI Student Assistant" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="box" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f1a5c"/><stop offset="1" stop-color="#1d1033"/></linearGradient>
    <marker id="ah" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#5eead4"/></marker>
  </defs>
  <style>
    .t{font:700 14px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle}
    .s{font:12px 'SFMono-Regular',Consolas,monospace;fill:#cdb6f5;text-anchor:middle}
    .h{font:700 13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#8b7fa8}
    .flow{stroke-dasharray:6 6;animation:dash 1s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-12}}
  </style>
  <rect width="900" height="270" rx="14" fill="#140a26"/>
  <text class="h" x="24" y="32">AI STUDENT ASSISTANT : HOW IT WORKS</text>

  <g stroke="#5eead4" stroke-width="2" fill="none" marker-end="url(#ah)">
    <line class="flow" x1="139" y1="105" x2="168" y2="105"/>
    <line class="flow" x1="287" y1="105" x2="316" y2="105"/>
    <line class="flow" x1="435" y1="105" x2="464" y2="105"/>
    <line class="flow" x1="583" y1="105" x2="612" y2="105"/>
    <line class="flow" x1="731" y1="105" x2="760" y2="105"/>
  </g>

  <g stroke="#8E5CC9" stroke-width="1.5" fill="url(#box)">
    <rect x="21"  y="65" width="118" height="80" rx="10"/>
    <rect x="169" y="65" width="118" height="80" rx="10"/>
    <rect x="317" y="65" width="118" height="80" rx="10"/>
    <rect x="465" y="65" width="118" height="80" rx="10"/>
    <rect x="613" y="65" width="118" height="80" rx="10"/>
    <rect x="761" y="65" width="118" height="80" rx="10" stroke="#5eead4"/>
  </g>
  <g>
    <text class="t" x="80"  y="100">Upload</text><text class="s" x="80"  y="122">study docs</text>
    <text class="t" x="228" y="100">Parse</text><text class="s" x="228" y="122">PyPDF</text>
    <text class="t" x="376" y="100">Embed</text><text class="s" x="376" y="122">SentenceTrans.</text>
    <text class="t" x="524" y="100">Store</text><text class="s" x="524" y="122">ChromaDB/FAISS</text>
    <text class="t" x="672" y="100">Retrieve</text><text class="s" x="672" y="122">vector search</text>
    <text class="t" x="820" y="100">Generate</text><text class="s" x="820" y="122">LLM API</text>
  </g>

  <path d="M820 145 L820 185" stroke="#5eead4" stroke-width="2" class="flow" marker-end="url(#ah)"/>
  <g>
    <rect x="610" y="190" width="130" height="40" rx="20" fill="#2f1a5c" stroke="#8E5CC9"/>
    <rect x="750" y="190" width="130" height="40" rx="20" fill="#2f1a5c" stroke="#8E5CC9"/>
    <text class="t" x="675" y="215">Answers</text>
    <text class="t" x="815" y="215">Summaries</text>
  </g>
  <rect x="470" y="190" width="130" height="40" rx="20" fill="#2f1a5c" stroke="#8E5CC9"/>
  <text class="t" x="535" y="215">Quizzes</text>
  <text class="s" x="24" y="250" style="text-anchor:start" fill-opacity=".8">Question in → relevant chunks retrieved → LLM answers from your own material</text>
</svg>
