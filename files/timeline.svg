<svg width="900" height="210" viewBox="0 0 900 210" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Journey timeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .y{font:800 18px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#fff;text-anchor:middle}
    .d{font:13px 'Segoe UI',Helvetica,Arial,sans-serif;fill:#cdb6f5;text-anchor:middle}
    .now{animation:ping 2s ease-out infinite;transform-origin:810px 100px}
    @keyframes ping{0%{transform:scale(1);opacity:.8}100%{transform:scale(2.6);opacity:0}}
  </style>
  <rect width="900" height="210" rx="14" fill="#140a26"/>
  <line x1="90" y1="100" x2="810" y2="100" stroke="#3b2370" stroke-width="4" stroke-linecap="round"/>
  <line x1="90" y1="100" x2="810" y2="100" stroke="#8E5CC9" stroke-width="4" stroke-linecap="round" stroke-dasharray="720" stroke-dashoffset="720">
    <animate attributeName="stroke-dashoffset" from="720" to="0" dur="2.5s" fill="freeze"/>
  </line>
  <g fill="#8E5CC9" stroke="#140a26" stroke-width="4">
    <circle cx="90" cy="100" r="11"/><circle cx="330" cy="100" r="11"/><circle cx="570" cy="100" r="11"/>
  </g>
  <circle class="now" cx="810" cy="100" r="11" fill="#5eead4"/>
  <circle cx="810" cy="100" r="11" fill="#5eead4" stroke="#140a26" stroke-width="4"/>

  <text class="y" x="90" y="62">2022</text>
  <text class="d" x="90" y="136">Starts B.E. CSE</text>
  <text class="d" x="90" y="156">Anna University</text>

  <text class="y" x="330" y="62">Jun 2026</text>
  <text class="d" x="330" y="136">AI Intern</text>
  <text class="d" x="330" y="156">Orvionar, Bangalore</text>

  <text class="y" x="570" y="62">Sep 2026</text>
  <text class="d" x="570" y="136">Internship complete</text>
  <text class="d" x="570" y="156">AI Student Assistant</text>

  <text class="y" x="810" y="62">Now</text>
  <text class="d" x="810" y="136">B.E. graduate</text>
  <text class="d" x="810" y="156">Open to roles</text>
</svg>
